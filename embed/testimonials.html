<!-- The four video testimonials, for the Video Testimonials page. Loaded by embed.js into a CMS box with id="sbp-embed-testimonials".
     Hosted on GitHub instead of Vimeo (Oct 2026). To add one: encode it into ../video/testimonial-NAME.mp4 + .jpg and add a figure. -->
<div class="sbp" id="sbp-testimonials">
<style>
#sbp-testimonials{--navy:#01253d;--gold:#d8b95c;--mute:#566b7a;--sans:interstate,"Helvetica Neue",Helvetica,Arial,sans-serif;font-family:var(--sans);container-type:inline-size;margin:0 0 3rem}
#sbp-testimonials *{box-sizing:border-box}
#sbp-testimonials .sbpv-grid{display:grid;grid-template-columns:1fr;gap:28px}
#sbp-testimonials figure{margin:0}
#sbp-testimonials figcaption{margin:12px 2px 0;line-height:1.4}
#sbp-testimonials figcaption b{display:block;color:var(--navy);font-size:18px;font-weight:700}
#sbp-testimonials figcaption span{display:block;color:var(--mute);font-size:15px}
@container (min-width:640px){#sbp-testimonials .sbpv-grid{grid-template-columns:1fr 1fr;gap:32px 24px}}
</style>
<div class="sbpv-grid">
